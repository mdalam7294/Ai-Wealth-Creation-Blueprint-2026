<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Wealth Creation Blueprint 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .whatsapp-float {
      position: fixed; bottom: 25px; right: 25px; z-index: 9999;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
    }
  </style>
</head>
<body class="bg-gray-50">

  <!-- Header -->
  <div class="max-w-7xl mx-auto p-5 flex justify-between items-center border-b bg-white sticky top-0 z-50">
    <h1 id="siteTitle" class="text-3xl font-bold">AI Wealth Creation Blueprint 2026</h1>
    <div class="flex gap-4">
      <select id="languageSelect" onchange="changeLanguage()" class="px-5 py-2.5 rounded-2xl border">
        <option value="en" selected>English</option>
        <option value="hi">हिंदी</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="ar">العربية</option>
      </select>
      <select id="currencySelect" onchange="changeCurrency()" class="px-5 py-2.5 rounded-2xl border">
        <option value="USD">$ USD</option>
        <option value="INR" selected>₹ INR</option>
        <option value="EUR">€ EUR</option>
        <option value="GBP">£ GBP</option>
        <option value="BRL">R$ BRL</option>
      </select>
    </div>
  </div>

  <!-- Landing -->
  <div id="landing" class="max-w-6xl mx-auto px-6 pt-16 pb-24">
    <div class="text-center max-w-4xl mx-auto">
      <h1 id="heroTitle" class="text-6xl font-bold leading-none tracking-tighter"></h1>
      <p id="heroDesc" class="mt-6 text-3xl text-gray-700"></p>
    </div>

    <!-- Presentation Video -->
    <div class="mt-16 max-w-4xl mx-auto">
      <h2 id="videoHeading" class="text-2xl font-semibold text-center mb-6"></h2>
      <iframe id="presentationVideo" width="100%" height="520" frameborder="0" allowfullscreen class="rounded-3xl shadow-2xl"></iframe>
    </div>

    <!-- 7 Days Refund Policy -->
    <div class="mt-16 max-w-3xl mx-auto bg-white rounded-3xl p-8 shadow text-center">
      <h3 id="refundTitle" class="text-2xl font-semibold mb-4"></h3>
      <p id="refundText" class="text-gray-700"></p>
    </div>

    <!-- Pricing -->
    <div class="mt-20 grid md:grid-cols-2 gap-10 max-w-5xl mx-auto">
      <div class="bg-white border-2 border-blue-600 rounded-3xl p-10 text-center">
        <h2 class="text-3xl font-bold">Monthly Plan</h2>
        <p id="monthlyPrice" class="text-7xl font-bold text-blue-600 mt-6"></p>
        <button onclick="showPayment('monthly')" id="monthlyBtn" class="mt-10 w-full bg-blue-600 text-white py-7 rounded-3xl text-2xl font-semibold"></button>
      </div>
      <div class="bg-white border-2 border-green-600 rounded-3xl p-10 text-center relative">
        <div class="absolute -top-4 right-8 bg-green-600 text-white px-6 py-2 rounded-3xl text-sm font-bold">MOST POPULAR</div>
        <h2 class="text-3xl font-bold">Lifetime Plan</h2>
        <p id="lifetimePrice" class="text-7xl font-bold text-green-600 mt-6"></p>
        <button onclick="showPayment('lifetime')" id="lifetimeBtn" class="mt-10 w-full bg-green-600 text-white py-7 rounded-3xl text-2xl font-semibold"></button>
      </div>
    </div>
  </div>

  <!-- WhatsApp Button -->
  <a href="https://wa.me/916299901015?text=Hi%2C%20I%20want%20to%20know%20more%20about%20AI%20Wealth%20Creation%20Blueprint%202026" 
     target="_blank" 
     class="whatsapp-float bg-[#25D366] w-14 h-14 rounded-full flex items-center justify-center shadow-2xl hover:scale-110 transition">
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="white" viewBox="0 0 24 24">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.198-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.485-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.917-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.263.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
      <path d="M12 2C6.48 2 2 6.59 2 12.253c0 2.2.71 4.23 1.9 5.89L2 22l3.92-1.03C8.07 21.64 9.98 22 12 22c5.52 0 10-4.59 10-10.253C22 6.59 17.52 2 12 2z"/>
    </svg>
  </a>

<script>
// ====================== TRANSLATIONS ======================
const translations = {
  en: {
    siteTitle: "AI Wealth Creation Blueprint 2026",
    heroTitle: "Build Real Digital Wealth in 2026",
    heroDesc: "Master AI-powered skills that generate income online — starting from zero.",
    videoHeading: "Watch How This Blueprint Can Change Your Future",
    refundTitle: "7-Day Money Back Guarantee",
    refundText: "If you are not satisfied with the course, you can request a full refund within 7 days of purchase.<br><strong>Condition:</strong> You must have completed at least 50% of the modules.<br>Only one refund per customer.",
    monthlyBtn: "Start Monthly Plan",
    lifetimeBtn: "Get Lifetime Access"
  },
  hi: {
    siteTitle: "AI Wealth Creation Blueprint 2026",
    heroTitle: "2026 में असली डिजिटल धन बनाएं",
    heroDesc: "AI-powered स्किल्स सीखें जो ऑनलाइन इनकम जनरेट करें — बिल्कुल जीरो से शुरू करके।",
    videoHeading: "देखिए यह ब्लूप्रिंट आपका भविष्य कैसे बदल सकता है",
    refundTitle: "7-दिन मनी बैक गारंटी",
    refundText: "अगर आपको कोर्स पसंद नहीं आता, तो खरीदने के 7 दिनों के अंदर पूर्ण रिफंड मांग सकते हैं।<br><strong>शर्त:</strong> कम से कम 50% मॉड्यूल पूरा करना जरूरी।<br>एक कस्टमर पर केवल एक रिफंड।",
    monthlyBtn: "मासिक प्लान शुरू करें",
    lifetimeBtn: "लाइफटाइम एक्सेस प्राप्त करें"
  }
  // Aap es, fr, ar ke translations yahan add kar sakte hain
};

let currentLang = "en";
let currentCurrency = "INR";

// Price Function
function getPrice(plan) {
  const rates = {USD:1, INR:94.7, EUR:0.87, GBP:0.76, BRL:5.65};
  const base = plan === "monthly" ? 59 : 299;
  let price = Math.round(base * (rates[currentCurrency] || 1));
  const symbol = currentCurrency === "INR" ? "₹" : currentCurrency === "EUR" ? "€" : currentCurrency === "GBP" ? "£" : currentCurrency === "BRL" ? "R\( " : " \)";
  return symbol + price;
}

function renderPrices() {
  document.getElementById("monthlyPrice").innerHTML = getPrice("monthly") + `<span class="text-2xl font-normal"> / month</span>`;
  document.getElementById("lifetimePrice").innerHTML = getPrice("lifetime");
}

// Change Language Function
function changeLanguage() {
  currentLang = document.getElementById("languageSelect").value;
  const t = translations[currentLang] || translations.en;

  document.getElementById("siteTitle").textContent = t.siteTitle;
  document.getElementById("heroTitle").textContent = t.heroTitle;
  document.getElementById("heroDesc").textContent = t.heroDesc;
  document.getElementById("videoHeading").textContent = t.videoHeading;
  document.getElementById("refundTitle").textContent = t.refundTitle;
  document.getElementById("refundText").innerHTML = t.refundText;
  document.getElementById("monthlyBtn").textContent = t.monthlyBtn;
  document.getElementById("lifetimeBtn").textContent = t.lifetimeBtn;

  // Video change according to language
  const videoLinks = {
    en: "https://www.youtube.com/embed/di1n07s8c9I",
    hi: "https://www.youtube.com/embed/7EOhBP6NTBc",   // Apna Hindi video link daal do
    es: "https://www.youtube.com/embed/Yq0QkCxoTHM",
    fr: "https://www.youtube.com/embed/nuEhBT31KQw",
    ar: "https://www.youtube.com/embed/di1n07s8c9I"
  };
  document.getElementById("presentationVideo").src = videoLinks[currentLang] || videoLinks.en;
}

function changeCurrency() {
  currentCurrency = document.getElementById("currencySelect").value;
  renderPrices();
}

function showPayment(plan) {
  const isMonthly = plan === "monthly";
  document.getElementById("payTitle").textContent = isMonthly ? "Monthly Plan Payment" : "Lifetime Plan Payment";
  document.getElementById("razorpayBtn").href = isMonthly ? RAZORPAY_MONTHLY : RAZORPAY_LIFETIME;
  document.getElementById("paypalBtn").href = isMonthly ? PAYPAL_MONTHLY : PAYPAL_LIFETIME;
  document.getElementById("paymentModal").classList.remove("hidden");
  document.getElementById("paymentModal").classList.add("flex");
}

function hidePaymentModal() {
  const modal = document.getElementById("paymentModal");
  modal.classList.add("hidden");
  modal.classList.remove("flex");
}

// Your Payment Links
const RAZORPAY_MONTHLY = "https://rzp.io/rzp/FGLkkmvL";
const RAZORPAY_LIFETIME = "https://rzp.io/rzp/QfH4dBd";
const PAYPAL_MONTHLY = "https://www.paypal.com/ncp/payment/VTPSCHRTDLQB4";
const PAYPAL_LIFETIME = "https://www.paypal.com/ncp/payment/5BPQ4LVHDCJLW";

window.onload = function() {
  changeLanguage();   // Initialize language
  renderPrices();

  // Landing click to show payment
  document.getElementById("landing").addEventListener("click", () => {
    if (!localStorage.getItem("courseAccess")) {
      showPayment("lifetime");
    }
  });
};
</script>
</body>
</html>
